# @ZNAME@ release (PINTAZ). Unsigned builds: Windows x64 (MSI + portable zip), macOS universal (DMG).
# Dispatched by "Upstream sync Z" after a gated merge, or by hand from the Actions tab (zrev "auto" = next free).
# Publishes the GitHub release v<version>-z<N> ONLY when the Windows build + smoke test and the Mac build all pass;
# the release is assembled as a draft, checked, then made public in one step (never a half release).
name: Release Z

on:
  workflow_dispatch:
    inputs:
      zrev:
        description: "Z revision: the tag is v<Cargo.toml version>-z<zrev> (auto = 1 + highest existing for this version)"
        type: string
        default: "auto"

permissions:
  contents: write

concurrency:
  group: release-z
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZREV: ${{ inputs.zrev }}
        run: |
          set -euo pipefail
          v=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next } in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          [ -n "$v" ] || { echo "::error::no [workspace.package] version"; exit 1; }
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' > /tmp/tags.txt
          git ls-remote --tags origin | sed 's#.*refs/tags/##; s#\^{}##' >> /tmp/tags.txt
          if [ "$ZREV" = "auto" ]; then
            ZREV=$(grep -E "^v${v//./\\.}-z[0-9]+$" /tmp/tags.txt | sed 's/.*-z//' | sort -n | tail -1 || true)
            ZREV=$(( ${ZREV:-0} + 1 ))
          fi
          [[ "$ZREV" =~ ^[0-9]+$ ]] || { echo "::error::zrev must be a number or auto"; exit 1; }
          tag="v$v-z$ZREV"
          if grep -qx "$tag" /tmp/tags.txt; then echo "::error::$tag already exists; pick a new zrev"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      @ZUPPER@_VERSION: ${{ needs.version.outputs.version }}
      @ZUPPER@_BUILD_DATE: ${{ needs.version.outputs.date }}
      @ZUPPER@_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fonts ref (rebrand.py writes upstream's pinned craft-fonts commit to .pintaz/fonts-ref.txt)
        shell: bash
        run: echo "FONTS_REF=$(tr -d '[:space:]' < .pintaz/fonts-ref.txt 2>/dev/null || true)" >> "$GITHUB_ENV"
      - name: Check out craft-fonts (OFL fonts, build-time only)
        if: env.FONTS_REF != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.FONTS_REF }}
          path: craft-fonts
      - name: Fonts env
        if: env.FONTS_REF != ''
        shell: bash
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-z-windows-x64
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g "WixToolset.UI.wixext/5.0.2" "WixToolset.Util.wixext/5.0.2"
      - name: Build and package (unsigned)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Smoke test (headless CLI + package checks; the GUI is never started)
        shell: pwsh
        run: python .pintaz/zsmoke.py dist/release @ZID@ $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      @ZUPPER@_VERSION: ${{ needs.version.outputs.version }}
      @ZUPPER@_BUILD_DATE: ${{ needs.version.outputs.date }}
      @ZUPPER@_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fonts ref (rebrand.py writes upstream's pinned craft-fonts commit to .pintaz/fonts-ref.txt)
        shell: bash
        run: echo "FONTS_REF=$(tr -d '[:space:]' < .pintaz/fonts-ref.txt 2>/dev/null || true)" >> "$GITHUB_ENV"
      - name: Check out craft-fonts (OFL fonts, build-time only)
        if: env.FONTS_REF != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.FONTS_REF }}
          path: craft-fonts
      - name: Fonts env
        if: env.FONTS_REF != ''
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-z-macos-universal
      - name: Tools the packaging script expects (resvg for the DMG background)
        run: |
          if grep -q "resvg" packaging/macos/package.sh; then
            v=$(grep -o "resvg --locked --version [0-9.]*" packaging/macos/package.sh | head -1 | awk '{print $NF}')
            cargo install resvg --locked ${v:+--version $v}
          fi
      - name: Build and package (ad-hoc signed, not notarized)
        run: packaging/macos/package.sh --arch universal
      - name: Check the DMG
        run: |
          set -euo pipefail
          ls -l dist/release
          dmg=$(ls dist/release/@ZID@-"$VERSION"-macos-universal.dmg)
          [ "$(stat -f %z "$dmg")" -gt 2000000 ] || { echo "::error::DMG too small"; exit 1; }
          hdiutil imageinfo "$dmg" >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish the release (draft, check, then public)
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for s in -windows-x64.msi -windows-x64-portable.zip -macos-universal.dmg; do
            [ -f "@ZID@-$VERSION$s" ] || { echo "::error::missing @ZID@-$VERSION$s"; exit 1; }
          done
          sha256sum -- * | tee SHA256SUMS.txt
          n=$(find . -maxdepth 1 -type f | wc -l)
          printf '%s\n\n%s\n' \
            "@ZNAME@ ${TAG#v}: free app by PINTAZ. Unsigned build: on Windows choose More info, then Run anyway; on Mac right-click the app, then Open." \
            "Based on the upstream project storytold/@UPREPO@ (Apache-2.0); see NOTICE." > ../notes.md
          gh release create "$TAG" --draft --title "@ZNAME@ ${TAG#v}" --target "$GITHUB_SHA" --notes-file ../notes.md -- *
          got=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.state == "uploaded")] | length')
          if [ "$got" != "$n" ]; then
            echo "::error::draft has $got of $n assets; deleting the draft, nothing published"
            gh release delete "$TAG" --yes || true
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG with $n assets." >> "$GITHUB_STEP_SUMMARY"
