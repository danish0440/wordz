[package]
name = "wordz-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordZ import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[dependencies]
wordz-doc = { workspace = true }
wordz-docx = { workspace = true }
craft-rtf = { workspace = true }
wordz-geom = { workspace = true, features = ["image"] }
wordz-metafile = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# Password-protected ODT (ODF 1.3 Part 2 §3.4): AES-256-CBC, SHA-1/SHA-256, PBKDF2 (HMAC-SHA-1).
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
miniz_oxide = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32-unknown-unknown): ODT change dates.
js-sys = "0.3"
# The browser's `crypto.getRandomValues` for the salts and vectors of encrypted saves.
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
wordz-doc = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
