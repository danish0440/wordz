[package]
name = "wordz-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordZ MCP server: every command as a tool, headless or bridged to the running app"

[lints]
workspace = true

[dependencies]
wordz-doc = { workspace = true }
wordz-engine = { workspace = true }
wordz-render = { workspace = true }
craft-mcp-server = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# The bridge to a running app (`Remote`): the control channel's authenticate-once client and token
# lookup, which do not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wordz-control-key = { workspace = true }
craft = { workspace = true, features = ["automation"] }
