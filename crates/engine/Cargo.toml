[package]
name = "wordz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordZ engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
wordz-geom = { workspace = true, features = ["image"] }
wordz-doc = { workspace = true }
wordz-fonts = { workspace = true }
wordz-layout = { workspace = true }
wordz-render = { workspace = true }
wordz-proof = { workspace = true }
wordz-docx = { workspace = true }
wordz-docbin = { workspace = true }
wordz-pdf = { workspace = true }
wordz-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32-unknown-unknown).
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
encoding_rs = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
