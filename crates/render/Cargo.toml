[package]
name = "wordz-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordZ rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
wordz-geom = { workspace = true, features = ["image"] }
wordz-doc = { workspace = true }
wordz-fonts = { workspace = true }
wordz-layout = { workspace = true }
wordz-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
